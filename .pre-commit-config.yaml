minimum_pre_commit_version: "4.6.0"
exclude: '^(artifacts/|docs/history/|third_party/|thesis/template/|docs/research/MASTER_EXECUTION_PROMPT\.md|claims/source_inventory\.json)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '^(benchmarks/mgp6/(annotation_kit_test|annotations)/|claims/|configs/|constraints/|docs/figures/|paper/.*/tables/|prompts/.*\.j2$|presentation/.*\.inspect\.ndjson$|reports/tables/)'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(benchmarks/mgp6/(annotation_kit_test|annotations)/|claims/|configs/|constraints/|docs/figures/|paper/.*/tables/|prompts/.*\.j2$|presentation/.*\.inspect\.ndjson$|reports/tables/)'
      - id: trailing-whitespace
        exclude: '^(benchmarks/mgp6/(annotation_kit_test|annotations)/|claims/|configs/|constraints/|docs/figures/|paper/.*/tables/|prompts/.*\.j2$|presentation/.*\.inspect\.ndjson$|reports/tables/)'
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint maintained Python
        entry: scripts/precommit_python.sh -m ruff check
        language: system
        types: [python]
        files: >-
          ^(src|tests|scripts|benchmarks)/|^deploy/download_longmemeval_s\.py$|^thesis/latex/tools/
      - id: ruff-format-check
        name: Ruff format maintained Python
        entry: scripts/precommit_python.sh -m ruff format --check
        language: system
        types: [python]
        files: >-
          ^(src|tests|scripts|benchmarks)/|^deploy/download_longmemeval_s\.py$|^thesis/latex/tools/
      - id: shell-syntax
        name: Bash syntax
        entry: bash -n
        language: system
        types: [shell]
      - id: repository-contract
        name: Repository and public-boundary contract
        entry: scripts/precommit_python.sh scripts/validate_repository.py
        language: system
        pass_filenames: false
        always_run: true
