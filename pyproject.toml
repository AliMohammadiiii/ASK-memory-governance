[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-memory-governance"
version = "0.2.0"
description = "Interpretable KEEP/SUPERSEDE/ABSTAIN governance for long-lived LLM memory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ali Mohammadi"}]
keywords = ["llm", "agents", "memory", "governance", "abstention", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyyaml>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "Jinja2>=3.1,<4",
  "numpy>=1.26,<2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=5,<7", "ruff==0.16.0", "mypy>=1.10,<2", "types-PyYAML>=6.0.12", "build>=1.2,<2", "pre-commit==4.6.1", "tqdm>=4.66,<5"]
schema = ["linkml>=1.7,<2", "linkml-runtime>=1.7,<2"]
ml = [
  "torch>=2.8,<3",
  "transformers>=5.14.1,<5.15",
  "accelerate>=0.34,<2",
  "sentence-transformers>=5.6.1,<5.7",
  "peft>=0.15.2,<1",
  "faiss-cpu>=1.8,<2",
]
pai = ["pydantic-ai>=0.0.13"]
documents = ["python-docx>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ask = [
  "py.typed",
  "baselines/prompts/*.j2",
  "resources/configs/*.yaml",
  "resources/schema/*.sql",
  "resources/schema/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "network: requires network access",
  "external_data: requires non-redistributed datasets",
  "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
exclude = [
  ".private",
  "docs/history",
  "paper",
  "thesis/tools",
  "tmp",
  "*.md",
  "Ali_Mohammadi_MGP6_v3_3_1_Final",
  "deliverables",
  "releases",
  "third_party",
  "benchmarks/mgp6/mgp6_v4_3/source",
  "benchmarks/mgp6/v3_human_pack",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
  "C401",
  "C402",
  "C416",
  "C420",
  "PIE790",
  "PIE810",
  "RET504",
  "RUF005",
  "RUF007",
  "RUF010",
  "RUF015",
  "RUF021",
  "RUF046",
  "RUF059",
  "SIM102",
  "SIM103",
  "SIM114",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These enums are serialized protocol values. StrEnum changes str(member).
"src/ask/memory/models.py" = ["UP042"]
"src/ask/protocol/core.py" = ["UP042"]
# External adapters may inherit the concrete no-op cleanup hook.
"benchmarks/mgp6/external/common.py" = ["B027"]

[tool.mypy]
python_version = "3.11"
packages = ["ask"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
