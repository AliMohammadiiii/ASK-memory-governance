[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-memory-governance"
version = "0.2.0"
description = "Interpretable KEEP/SUPERSEDE/ABSTAIN governance for long-lived LLM memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ali Mohammadi"}]
keywords = ["llm", "agents", "memory", "governance", "abstention", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyyaml>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "Jinja2>=3.1,<4",
  "numpy>=1.26,<2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=5,<7", "ruff>=0.5,<1", "mypy>=1.10,<2", "types-PyYAML>=6.0.12", "build>=1.2,<2"]
schema = ["linkml>=1.7,<2", "linkml-runtime>=1.7,<2"]
ml = [
  "torch>=2.8,<3",
  "transformers>=4.57,<4.58",
  "accelerate>=0.34,<2",
  "sentence-transformers>=5.1,<6",
  "peft>=0.15.2,<1",
  "faiss-cpu>=1.8,<2",
]
pai = ["pydantic-ai>=0.0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ask = [
  "py.typed",
  "baselines/prompts/*.j2",
  "resources/configs/*.yaml",
  "resources/schema/*.sql",
  "resources/schema/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "network: requires network access",
  "external_data: requires non-redistributed datasets",
  "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "docs/history",
  "paper",
  "thesis",
  "Ali_Mohammadi_MGP6_v3_3_1_Final",
  "deliverables",
  "releases",
  "benchmarks/mgp6/mgp6_v4_3/source",
  "benchmarks/mgp6/v3_human_pack",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "B904", "B027", "B007", "E741", "E702", "UP031", "UP042", "B017"]

[tool.mypy]
python_version = "3.11"
packages = ["ask"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
