id: https://thesis.ali-mohammadi.org/schemas/ask_memory
name: ask_memory
title: ASK Controller — Memory Governance Schema
description: >-
  LinkML schema for the Keep / Supersede / Abstain controller's memory substrate
  and action log. Matches §I.5.1 and §I.5.5 of the Master's thesis proposal.
license: MIT
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  ask: https://thesis.ali-mohammadi.org/schemas/ask_memory/

default_prefix: ask
default_range: string

imports:
  - linkml:types

# ------------------------------------------------------------------- #
# Enums                                                               #
# ------------------------------------------------------------------- #

enums:

  MemoryType:
    description: >-
      Three memory classes (§I.5.2). Events and commitments collapsed into
      episodic_fact for the Master's scope.
    permissible_values:
      stable_pref:
        description: Stable preference (slow-changing, high θ_sup)
      transient_pref:
        description: Transient or context-bounded preference (low θ_sup)
      episodic_fact:
        description: Episodic fact, event, or commitment

  MemoryStatus:
    description: Lifecycle status of a memory_item
    permissible_values:
      active:
        description: Currently-held belief (default)
      superseded:
        description: Previously-held belief; replaced by a newer memory_item via `supersedes_id`

  RelationKind:
    description: >-
      Allowed relation labels between two memory_items (§I.5.1).
      Restricted set; no "unclear" here — unclear is a classifier output, not a stored relation.
    permissible_values:
      supports:
      contradicts:
      supersedes:

  ControllerAction:
    description: The three controller actions (§I.5.5)
    permissible_values:
      Keep:
      Supersede:
      Abstain:

# ------------------------------------------------------------------- #
# Classes                                                             #
# ------------------------------------------------------------------- #

classes:

  MemoryItem:
    description: A single stored belief about user-stated information.
    attributes:
      id:
        identifier: true
        range: integer
        required: true
      type:
        range: MemoryType
        required: true
      text:
        range: string
        required: true
        description: Human-readable memory statement
      normalized_value:
        range: string
        description: Optional canonical form for deduplication
      status:
        range: MemoryStatus
        required: true
      confidence:
        range: float
        required: true
        minimum_value: 0.0
        maximum_value: 1.0
        description: Extraction/commitment confidence
      created_at:
        range: datetime
        required: true
        description: Transaction time
      valid_from:
        range: datetime
        description: Optional user-stated validity time
      supersedes_id:
        range: MemoryItem
        description: FK to the prior MemoryItem this one replaces
      evidence_spans:
        range: EvidenceSpan
        multivalued: true
        description: Evidence spans from dialogue supporting this memory_item

  EvidenceSpan:
    description: A citation span in dialogue supporting a memory_item.
    attributes:
      id:
        identifier: true
        range: integer
        required: true
      session_id:
        range: string
        required: true
      turn_index:
        range: integer
        required: true
      start_char:
        range: integer
      end_char:
        range: integer
      text:
        range: string
        required: true
      created_at:
        range: datetime
        required: true

  MemoryRelation:
    description: >-
      A typed edge between two memory_items. The `supersedes` relation is also
      encoded on MemoryItem.supersedes_id for fast lineage queries; this table
      also records `supports` and `contradicts` for classifier provenance.
    attributes:
      id:
        identifier: true
        range: integer
        required: true
      from_memory:
        range: MemoryItem
        required: true
      to_memory:
        range: MemoryItem
        required: true
      relation:
        range: RelationKind
        required: true
      created_at:
        range: datetime
        required: true

  ActionLogEntry:
    description: >-
      A single controller decision with full feature snapshot and rationale.
      Serialized as JSONL (one entry per line) via src/ask/audit/action_log.py
      and validated against the JSON Schema generated from this class.
    tree_root: true
    attributes:
      id:
        identifier: true
        range: integer
        required: true
      timestamp:
        range: datetime
        required: true
      action:
        range: ControllerAction
        required: true
      candidate_text:
        range: string
        required: true
      prior_memory_id:
        range: MemoryItem
        description: The memory_item the candidate was compared against (if any)
      candidate_id:
        range: integer
        description: The extracted candidate id used by the controller, if materialized
      resulting_memory_id:
        range: MemoryItem
        description: The memory_item created/affected by the action (if any)
      feature_c:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: Contradiction strength
      feature_e:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: Explicitness
      feature_f:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: Extraction confidence
      feature_r:
        range: float
        minimum_value: -1.0
        maximum_value: 1.0
        description: Signed relation classifier signal
      feature_rho:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: Recency protection
      s_rev:
        range: float
        description: Supersede score
      s_abs:
        range: float
        description: Abstain score
      theta_sup:
        range: float
        description: Per-type Supersede threshold used for this decision
      theta_abs:
        range: float
        description: Abstain threshold used for this decision
      rationale:
        range: string
        required: true
        description: Human-readable justification string
