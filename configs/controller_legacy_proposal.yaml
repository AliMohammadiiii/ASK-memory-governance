# Legacy named weights and thresholds — Master's thesis proposal §I.5.5 Table.
# These are the starting values; sensitivity analysis reports at ±0.1.

# Per-type Supersede scoring:
#   S_rev = α·c + β·e + γ·f + δ·r − ε·ρ
#
# Abstain scoring (type-independent):
#   S_abs = σ · ambiguity(c) + ζ · (1 − f)
#   ambiguity(c) = 1 − 2·|c − 0.5|   (maximized at c = 0.5)

types:
  stable_pref:
    weights:    { alpha: 0.35, beta: 0.30, gamma: 0.15, delta: 0.10, epsilon: 0.10 }
    theta_sup:  0.75
    tau:        40        # recency half-life, turns

  transient_pref:
    weights:    { alpha: 0.30, beta: 0.25, gamma: 0.20, delta: 0.15, epsilon: 0.10 }
    theta_sup:  0.55
    tau:        10

  episodic_fact:
    weights:    { alpha: 0.40, beta: 0.20, gamma: 0.25, delta: 0.05, epsilon: 0.10 }
    theta_sup:  0.65
    tau:        30

abstain:
  sigma:      0.50
  zeta:       0.50
  theta_abs:  0.50
