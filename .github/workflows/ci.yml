name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: pre-commit run --all-files
      - run: make release-check PYTHON=python
      - run: make validate-public-data validate-traces validate-experiments verify-paper-artifacts readiness PYTHON=python

  manuscript-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y latexmk poppler-utils texlive-fonts-recommended
          texlive-lang-arabic texlive-latex-extra texlive-xetex
      - run: make paper thesis PYTHON=python
      - run: test -s build/manuscripts/paper.pdf
      - run: test -s build/manuscripts/thesis.pdf
      - run: test -z "$(git status --short)"
