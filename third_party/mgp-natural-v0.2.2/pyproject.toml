[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgp-natural"
version = "0.2.2"
description = "Reproducible construction and evaluation tooling for natural-conversation write-time memory governance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0 (code only; data rights excluded)"}
authors = [{name = "MGP-Natural contributors"}]
keywords = ["memory governance", "benchmark", "conversation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
  "setuptools>=68",
  "types-PyYAML>=6.0.12",
  "wheel>=0.43",
]
huggingface = ["huggingface-hub>=0.24,<2"]

[project.scripts]
mgp-natural = "mgp_natural.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mgp_natural = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".private", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/mgp_natural"]
strict = true
warn_unreachable = true
exclude = ["tests", "build", "dist"]

[[tool.mypy.overrides]]
module = ["huggingface_hub", "spacy"]
ignore_missing_imports = true

